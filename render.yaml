services:
  - type: web
    name: nazon
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: NAZON_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: nazon-db
          property: connectionString
databases:
  - name: nazon-db
    plan: free
